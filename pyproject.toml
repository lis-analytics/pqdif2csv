[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pqdif2csv"
version = "0.1.0"
description = "Read PQDIF (IEEE 1159.3) power quality files in pure Python and export them to CSV or Excel."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
keywords = ["PQDIF", "IEEE 1159.3", "power quality", "harmonics", "flicker", "CSV"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]
test = ["pytest>=7", "openpyxl>=3.0"]

[project.scripts]
pqdif2csv = "pqdif2csv.__main__:main"

[tool.setuptools]
packages = ["pqdif2csv"]

[project.urls]
Homepage = "https://github.com/lis-analytics/pqdif2csv"
Issues = "https://github.com/lis-analytics/pqdif2csv/issues"
Company = "https://lisanalytics.net"
